packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@browserbasehq/stagehand": ^3.7.1
  "@fastify/cors": ^11.3.0
  "@types/node": ^24
  "@vitejs/plugin-vue": ^6.0.8
  better-sqlite3: ^13.0.3
  dotenv: ^17.4.2
  fastify: ^5.11.2
  openai: ^4.104.0
  stagehand: ^1.0.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  vue: ^3.5.41
  vue-router: ^5.2.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@google/genai": true
  better-sqlite3: set this to true or false
  bufferutil: true
  protobufjs: true
